<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Foot Friends</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d1f" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='white' stroke='black'/><circle cx='8' cy='8' r='2.5'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="cv"></canvas>

    <!-- commandes tactiles du joueur 1 (affichées sur écran tactile, pendant le match) -->
    <div id="touch">
      <div class="pad left">
        <div class="tbtn" data-action="left">◀</div>
        <div class="tbtn" data-action="right">▶</div>
      </div>
      <div class="pad right">
        <div class="tbtn" data-action="punch">POING</div>
        <div class="tbtn" data-action="kick">TIR</div>
        <div class="tbtn" data-action="super">SUPER</div>
        <div class="tbtn big" data-action="jump">SAUT</div>
      </div>
    </div>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <!-- le jeu se joue à l'horizontale : à la verticale, ce message recouvre tout -->
    <div id="rotate">
      <p>Tourne ton téléphone<br />à l'horizontale</p>
    </div>

    <!-- les écrans (titre, sélection, pause, fin) sont montés ici par src/ui -->
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
